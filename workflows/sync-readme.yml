name: Sync README to Website

on:
  repository_dispatch:
    types:
      - sync-profile

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website repository
        uses: actions/checkout@v4

      - name: Download README.md
        run: |
          curl -L \
            https://raw.githubusercontent.com/plna/plna/main/README.md \
            -o index.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Sync README.md to index.md"
          git push
