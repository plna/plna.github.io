name: Sync README

on:
  repository_dispatch:
    types:
      - sync-profile

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website repository
        uses: actions/checkout@v4

      - name: Download README.md
        run: |
          curl -L \
            https://raw.githubusercontent.com/plna/plna/main/README.md \
            -o README.md

      - name: Update profile section
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path("index.md")
          readme = Path("README.md")

          index_content = index.read_text()
          readme_content = readme.read_text()

          start = "<!-- PROFILE:START -->"
          end = "<!-- PROFILE:END -->"

          if start not in index_content or end not in index_content:
              raise SystemExit("PROFILE markers not found in index.md")

          before = index_content.split(start, 1)[0]
          after = index_content.split(end, 1)[1]

          new_content = (
              before
              + start
              + "\n\n"
              + readme_content.strip()
              + "\n\n"
              + end
              + after
          )

          index.write_text(new_content)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Sync README.md to index.md"
          git push
